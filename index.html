      var d=i%3===1?'d1':(i%3===2?'d2':'');
      var url=PROJECT_URLS[p.title]||'#contact';
      return '<a class="pcard reveal '+d+'" data-hot href="'+url+'" aria-label="לפרטים נוספים על '+p.title+'">'+
        '<div class="pcard-img"><img src="'+p.image+'" alt="'+('הדמיית '+p.title+(p.location?' — '+p.location:''))+'" loading="lazy" />'+
        '<span class="pcard-tag '+tagClass(p.sale)+'">'+(p.sale||CAT[p.cat]||'')+'</span></div>'+
        '<div class="pcard-body"><div class="pcard-ttl">'+p.title+'</div>'+
        '<div class="pcard-loc">'+p.location+'</div>'+
        '<div class="pcard-facts">'+chips(p)+'</div>'+
        '<div class="pcard-cta"><b>לפרטים נוספים</b><i>←</i></div></div></a>';
    }).join('');
    grid.querySelectorAll('.pcard').forEach(function(el,i){
      if(window.__observeReveal) window.__observeReveal(el);
    });
  }
  var lb=document.getElementById('lb'),lbImg=document.getElementById('lbImg'),lbTitle=document.getElementById('lbTitle'),
      lbLoc=document.getElementById('lbLoc'),lbDesc=document.getElementById('lbDesc'),
      lbCat=document.getElementById('lbCat'),lbSale=document.getElementById('lbSale'),
      lbFacts=document.getElementById('lbFacts'),lbFill=document.getElementById('lbFill'),
      lbCatWrap=document.getElementById('lbCatWrap'),
      lbThumbs=document.getElementById('lbThumbs'),
      lbSteps=[].slice.call(document.querySelectorAll('.lb-status .lb-steps span'));
  var ICONS={
    units:'<svg viewBox="0 0 24 24"><path d="M4 21V5l8-3 8 3v16"/><path d="M9 21v-5h6v5"/><path d="M8 8h.01M12 8h.01M16 8h.01M8 12h.01M16 12h.01"/></svg>',
    floors:'<svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5"/><path d="M3 12l9 5 9-5"/><path d="M3 16l9 5 9-5"/></svg>',
    renew:'<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>',
    build:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>',
    park:'<svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="8" rx="2"/><path d="M6 11V8a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v3"/></svg>',
    key:'<svg viewBox="0 0 24 24"><circle cx="8" cy="9" r="4"/><path d="M11 11l9 9M17 17l2-2"/></svg>'
  };
  var curCat='', curTitle='';
  function openLB(p){
    lbImg.src=p.image;lbImg.alt=p.title;lbTitle.textContent=p.title;lbLoc.textContent=p.location;lbDesc.textContent=p.description;
    /* image gallery: show thumbnails when a project has more than one render */
    var imgs=(p.gallery&&p.gallery.length>1)?p.gallery:[];
    lbThumbs.innerHTML=imgs.map(function(src,i){
      return '<button type="button" class="'+(i===0?'on':'')+'" aria-label="תמונה '+(i+1)+'"><img src="'+src+'" alt="" loading="lazy" /></button>';
    }).join('');
    [].forEach.call(lbThumbs.children,function(btn,i){
      btn.addEventListener('click',function(){
        lbImg.src=imgs[i];
        [].forEach.call(lbThumbs.children,function(b){b.classList.remove('on');});
        btn.classList.add('on');
      });
    });
    curCat=CAT[p.cat]||''; curTitle=p.title||'';
    lbCat.textContent=curCat;
    lbSale.textContent=p.sale||''; lbSale.style.display=p.sale?'':'none';
    lbSale.className='lb-sale '+tagClass(p.sale);
    /* animated category overlay — renewal sweeps old→new, marketing pulses */
    var cw;
    if(p.cat==='renewal') cw='<div class="catanim renewal"><span class="ca-lab">'+CAT.renewal+'</span><span class="ca-ba"><b>ישן</b><span class="ar">→</span><b>חדש</b></span></div>';
    else if(p.cat==='sale') cw='<div class="catanim sale"><span class="ca-dot"></span><span class="ca-lab">בשיווק · מחיר למשתכן</span></div>';
    else if(p.cat==='commercial') cw='<div class="catanim commercial"><span class="ca-dot"></span><span class="ca-lab">'+CAT.commercial+'</span></div>';
    else cw='<div class="catanim build"><span class="ca-dot"></span><span class="ca-lab">'+CAT.build+'</span></div>';
    lbCatWrap.innerHTML=cw;
    /* fact icons */
    lbFacts.innerHTML=(p.facts||[]).map(function(f){return '<div class="fact">'+(ICONS[f.k]||ICONS.build)+'<b>'+f.v+'</b><span>'+f.l+'</span></div>';}).join('');
    /* status bar: רישוי → ביצוע → אכלוס (animate fill on open) */
    var st=p.stage||1;
    lbFill.style.transition='none'; lbFill.style.width='0'; void lbFill.offsetWidth;
    lbFill.style.transition='width 1s cubic-bezier(.2,.8,.2,1) .15s';
    lbFill.style.width=(st/3*100)+'%';
    lbSteps.forEach(function(s){ s.classList.toggle('on',(+s.getAttribute('data-s'))<=st); });
    lb.classList.add('on');document.body.style.overflow='hidden';
  }
  function closeLB(){lb.classList.remove('on');document.body.style.overflow='';}
  document.getElementById('lbClose').addEventListener('click',closeLB);
  lb.addEventListener('click',function(e){if(e.target===lb)closeLB();});
  addEventListener('keydown',function(e){if(e.key==='Escape')closeLB();});
  var lbCta=document.getElementById('lbCta');
  if(lbCta) lbCta.addEventListener('click',function(){
    var sel=document.getElementById('lf-project');
    if(sel&&curTitle){var key=curTitle.split(' · ')[0];
      for(var o=0;o<sel.options.length;o++){if(sel.options[o].text.indexOf(key)!==-1){sel.selectedIndex=o;break;}}}
    closeLB();
  });
  var featEl=document.querySelector('.feat[data-project="feat"]');

  /* ---- Base44 data layer (graceful: falls back to the static data offline) ----
     When the Base44 SDK is present (window.base44), projects load from the
     `Project` entity and the featured card from a record flagged `featured:true`.
     See /base44 for entity schemas, seed data and the integration guide. */
  function normalizeProject(r){
    var facts=r.facts;
    if(typeof facts==='string'){ try{ facts=JSON.parse(facts); }catch(e){ facts=[]; } }
    var gallery=r.gallery;
    if(typeof gallery==='string'){ try{ gallery=JSON.parse(gallery); }catch(e){ gallery=[]; } }
    return { title:r.title, location:r.location, cat:r.cat, sale:r.sale, stage:+r.stage||1,
             image:r.image, gallery:gallery||[], description:r.description, facts:facts||[], featured:!!r.featured, order:+r.order||0 };
  }
  function projectsFromRows(items){
    if(!items || !items.length) return null;
    var all=items.map(normalizeProject).sort(function(a,b){return a.order-b.order;});
    var feat=all.filter(function(p){return p.featured;})[0];
    return { list:all.filter(function(p){return !p.featured;}), featured:feat||FEATURED };
  }
  function loadProjects(){
    var api=(window.SHELLY_BASE44_API||"").replace(/\/+$/,"");
    /* 1) public Base44 function (works on the static site) */
    if(api){
      return fetch(api+"/getPublicProjects",{headers:{Accept:"application/json"}})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){ return projectsFromRows(d && (d.projects||d.items||d)); })
        .catch(function(){ return null; });
    }
    /* 2) Base44 SDK (when the site runs inside the Base44 app) */
    if(window.base44 && base44.entities && base44.entities.Project){
      return base44.entities.Project.list().then(function(items){ return projectsFromRows(items); }).catch(function(){ return null; });
    }
    /* 3) embedded fallback */
    return Promise.resolve(null);
  }
  function initProjects(){
    loadProjects().then(function(data){
      if(data){ if(data.featured) FEATURED=data.featured; renderProjects(data.list.length?data.list:PROJECTS); }
      else { renderProjects(PROJECTS); }
    });
  }
  initProjects();

  var statIO=new IntersectionObserver(function(es){es.forEach(function(e){
    if(!e.isIntersecting)return;statIO.unobserve(e.target);
    var node=e.target,end=+node.getAttribute('data-count'),t0=null,dur=1500;
    function tk(ts){if(!t0)t0=ts;var k=Math.min((ts-t0)/dur,1);var ease=1-Math.pow(1-k,3);
      node.firstChild.nodeValue=Math.round(end*ease).toLocaleString('en-US');if(k<1)requestAnimationFrame(tk);}
    requestAnimationFrame(tk);
  });},{threshold:.5});
  document.querySelectorAll('.num[data-count]').forEach(function(n){statIO.observe(n);});

  var stepEl=document.querySelector('.exec-steps');
  if(stepEl){var sIO=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');sIO.unobserve(e.target);}});},{threshold:.5});sIO.observe(stepEl);}

  var form=document.getElementById('leadForm');
  function v(id){var el=document.getElementById(id);return el?el.value.trim():"";}
  function setError(id,message){
    var input=document.getElementById(id), error=document.getElementById(id+'-error');
    if(input) input.setAttribute('aria-invalid',message?'true':'false');
    if(error) error.textContent=message||'';
  }
  function validPhone(phone){return /^(?:\+?972|0)(?:-?5\d){1}(?:-?\d){7}$/.test(phone.replace(/\s/g,''));}
  function setStatus(message,state){
    var status=document.getElementById('leadStatus');
    if(status){status.textContent=message;status.setAttribute('data-state',state||'');}
  }
  if(form) form.addEventListener('submit',function(e){
    e.preventDefault();
    setError('lf-name','');setError('lf-phone','');setError('lf-email','');setStatus('','');
    if(v('lf-website')) return;
    var d={name:v('lf-name'),phone:v('lf-phone'),email:v('lf-email'),project:v('lf-project'),
           rooms:v('lf-rooms'),budget:v('lf-budget'),timeline:v('lf-timeline'),message:v('lf-msg'),source:"website"};
    var btn=form.querySelector('.submit');
    var invalid=null;
    if(d.name.length<2){setError('lf-name','נא להזין שם מלא.');invalid=document.getElementById('lf-name');}
    if(!validPhone(d.phone)){setError('lf-phone','נא להזין מספר טלפון ישראלי תקין.');invalid=invalid||document.getElementById('lf-phone');}
    if(d.email && !document.getElementById('lf-email').checkValidity()){setError('lf-email','נא להזין כתובת דוא״ל תקינה.');invalid=invalid||document.getElementById('lf-email');}
    if(invalid){invalid.focus();setStatus('יש לתקן את השדות המסומנים.','error');return;}
    var last=Number(sessionStorage.getItem('shellyLeadSubmittedAt')||0);
    if(Date.now()-last<30000){setStatus('הפנייה האחרונה כבר נשלחה. אפשר לנסות שוב בעוד כמה שניות.','error');return;}
    /* Lead delivery: public Base44 submitLead function, with SDK only when embedded in Base44. */
    function sendLead(d){
      var api=(window.SHELLY_BASE44_API||"").replace(/\/+$/,"");
      if(api){
        return fetch(api+"/submitLead",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)})
          .then(function(r){ if(!r.ok) throw new Error("http "+r.status); return true; });
      }
      if(window.base44 && base44.entities && base44.entities.Lead){
        return base44.entities.Lead.create(d).then(function(){ return true; });
      }
      return Promise.reject(new Error("no-backend"));
    }
    if(btn){btn.disabled=true;btn.textContent="שולח…";}
    setStatus('הפנייה נשלחת…','');
    sendLead(d)
      .then(function(){
        sessionStorage.setItem('shellyLeadSubmittedAt',String(Date.now()));
        setStatus('תודה, הפנייה התקבלה בהצלחה. נחזור אליכם בהקדם.','success');
        if(btn) btn.textContent="נשלח ✓";
        form.reset();
      })
      .catch(function(){
        setStatus('לא הצלחנו לשלוח את הפנייה. נסו שוב או צרו קשר בטלפון 08-862-3366.','error');
        if(btn){btn.disabled=false;btn.textContent="יצירת קשר";}
      });
  });
  document.getElementById('yr').textContent=new Date().getFullYear();
})();
</script>
<!-- ============ AVAILABILITY board (Base44 Unit entity) ============ -->
<script>
(function(){
  var BADGE={available:["available","🟢 פנוי"],reserved:["reserved","🟡 בהמתנה"],sold:["sold","🔴 נמכר"]};
  var grid=document.getElementById('availGrid'), filt=document.getElementById('availFilter'), note=document.getElementById('availNote');
  if(!grid) return;
  function nis(n){try{return "₪"+Number(n).toLocaleString("he-IL");}catch(e){return "₪"+n;}}
  /* Normalize a public Base44 unit record. */
  function loc(u){ return u.location || ((u.project||'').split(',')[1]||'').trim(); }
  function priceOf(u){ return u.priceFrom || u.price || 0; }
  function reserve(u){
    var sel=document.getElementById('lf-project');
    if(sel){var key=(u.project||'').split(' · ')[0].split(',')[0].trim();
      for(var o=0;o<sel.options.length;o++){if(sel.options[o].text.indexOf(key)!==-1){sel.selectedIndex=o;break;}}}
    var msg=document.getElementById('lf-msg');
    if(msg){var l=loc(u);var line="מעוניין/ת לשריין: דירת "+u.rooms+" חדרים · "+u.project+(l?" · "+l:"");
      msg.value=msg.value?(msg.value+"\n"+line):line;}
    location.hash="#contact";
    var nm=document.getElementById('lf-name'); if(nm) setTimeout(function(){nm.focus();},400);
  }
  function card(u){
    var b=BADGE[u.status]||BADGE.available, sold=u.status==='sold', l=loc(u);
    var el=document.createElement('article'); el.className='unit-card'+(sold?' sold':'');
    el.innerHTML=
      '<div class="unit-img"><img src="'+u.image+'" alt="הדמיית '+u.project+'" loading="lazy" />'+
        '<span class="unit-badge '+b[0]+'">'+b[1]+'</span>'+
        '<span class="unit-sim">הדמיה</span></div>'+
      '<div class="unit-body">'+
        '<div class="unit-title">דירת '+u.rooms+' חדרים</div>'+
        '<div class="unit-proj">'+u.project+(l?' · '+l:'')+'</div>'+
        '<div class="unit-price">'+(sold?'נמכר':'מחיר ופרטים — <b>בשיחה אישית</b>')+'</div>'+
      '</div>';
    var btn=document.createElement('button');
    if(sold){btn.className='unit-btn off';btn.textContent='נמכר';btn.disabled=true;}
    else{btn.className='unit-btn go';btn.textContent=(u.status==='reserved'?'בקשת מידע · בהמתנה':'לתיאום פגישה');
      btn.addEventListener('click',function(){reserve(u);});}
    el.querySelector('.unit-body').appendChild(btn);
    if(!sold){var ml=document.createElement('a');ml.className='unit-mail';
      ml.href='mailto:Office@shellyurban.co.il?subject='+encodeURIComponent('התעניינות בדירת '+u.rooms+' חדרים · '+u.project);
      ml.textContent='או צרו קשר במייל ›';el.querySelector('.unit-body').appendChild(ml);}
    return el;
  }
  function render(list){
    grid.innerHTML='';
    var projects=[]; list.forEach(function(u){if(projects.indexOf(u.project)===-1)projects.push(u.project);});
    filt.innerHTML=''; var current='__all';
    function paint(){
      grid.innerHTML='';
      list.filter(function(u){return current==='__all'||u.project===current;})
          .forEach(function(u){grid.appendChild(card(u));});
      Array.prototype.forEach.call(filt.children,function(c){c.classList.toggle('on',c.getAttribute('data-p')===current);});
    }
    function chip(label,val){var c=document.createElement('button');c.textContent=label;c.setAttribute('data-p',val);
      c.addEventListener('click',function(){current=val;paint();});filt.appendChild(c);}
    chip('הכל','__all'); projects.forEach(function(p){chip(p.split(' · ')[0].split(',')[0],p);});
    paint();
    var avail=list.filter(function(u){return u.status==='available';}).length;
    note.textContent='כעת '+avail+' דירות פנויות. כל התמונות הן הדמיות אדריכליות להמחשה בלבד ואינן מהוות מצג מחייב.';
  }
  function renderEmpty(){
    grid.innerHTML='<div class="unit-empty" role="status"><strong>אין כרגע דירות להצגה</strong><p>לקבלת מידע עדכני על זמינות, צרו איתנו קשר.</p><a class="unit-btn go" href="#contact">יצירת קשר</a></div>';
    filt.innerHTML='';
    note.textContent='המלאי החי אינו זמין כרגע. לא מוצגים נתוני הדגמה.';
  }
  var API=(window.SHELLY_BASE44_API||"").replace(/\/+$/,"");
  if(API){
    fetch(API+"/getPublicUnits",{headers:{Accept:"application/json"}})
      .then(function(r){return r.ok?r.json():null;})
      .then(function(d){ var rows=d&&(d.units||d.items||d); (rows&&rows.length)?render(rows):renderEmpty(); })
      .catch(renderEmpty);
  } else if(window.base44 && base44.entities && base44.entities.Unit){
    base44.entities.Unit.list().then(function(rows){
      if(rows && rows.length) render(rows); else renderEmpty();
    }).catch(renderEmpty);
  } else { renderEmpty(); }
})();
</script>
